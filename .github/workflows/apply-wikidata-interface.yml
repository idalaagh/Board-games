name: Apply no-key game lookup update

on:
  push:
    branches:
      - feature/bgg-auto-import
    paths:
      - .github/workflows/apply-wikidata-interface.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.repository == 'idalaagh/Board-games'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested patch to large index.html
        run: |
          git apply --check wikidata-interface.patch
          git apply wikidata-interface.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use anonymous Wikidata lookup instead of BGG API"
          git push
