name: Apply complexity label fix
on:
  push:
    branches:
      - fix/complexity-levels
    paths:
      - .github/workflows/apply-weight-levels.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply and verify patch
        run: |
          git apply --check weight-levels.patch
          git apply weight-levels.patch
          git diff --check
          node --test tests/bgg-import.test.js
      - name: Commit fixed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct BGG weight labels to Light Medium Heavy"
          git push
