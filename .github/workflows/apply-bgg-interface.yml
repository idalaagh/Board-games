name: Apply BGG interface update

on:
  push:
    branches:
      - feature/bgg-auto-import
    paths:
      - .github/workflows/apply-bgg-interface.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.repository == 'idalaagh/Board-games'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply small patch to existing large index.html
        run: |
          git apply --check bgg-interface.patch
          git apply bgg-interface.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add BoardGameGeek auto-import to add-game form"
          git push
